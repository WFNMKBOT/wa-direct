<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WA Direct - Chat Tanpa Save</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-5 py-4 sticky top-0 z-10 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-lg">
        WA
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight text-white">WA Direct</h1>
        <p class="text-xs text-slate-400">Chat cepat tanpa simpan kontak</p>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 p-5 max-w-md w-full mx-auto space-y-6">

    <!-- Input Nomor -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4 shadow-lg">
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label for="phone" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Nomor WhatsApp</label>
          <button onclick="pasteNumber()" class="text-xs text-emerald-400 hover:text-emerald-300 font-medium flex items-center gap-1 active:scale-95 transition">
            📋 Paste Nomor
          </button>
        </div>
        <div class="relative flex items-center">
          <span class="absolute left-3.5 text-slate-400 font-semibold text-sm">+62</span>
          <input 
            type="tel" 
            id="phone" 
            placeholder="812-3456-7890" 
            class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-xl py-3 pl-12 pr-10 text-white placeholder-slate-600 text-base outline-none transition"
          >
          <button onclick="clearInput()" id="clearBtn" class="hidden absolute right-3 text-slate-500 hover:text-slate-300 p-1">
            ✕
          </button>
        </div>
        <p class="text-[11px] text-slate-500 mt-1.5">Bisa format 08..., +628..., atau langsung paste aja.</p>
      </div>

      <!-- Input Pesan -->
      <div>
        <label for="message" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Pesan Pembuka (Opsional)</label>
        <textarea 
          id="message" 
          rows="3" 
          placeholder="Tulis pesan di sini..." 
          class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-xl p-3 text-white placeholder-slate-600 text-sm outline-none transition resize-none"
        ></textarea>
        
        <!-- Template Cepat -->
        <div class="flex gap-2 overflow-x-auto pt-2 pb-1 no-scrollbar">
          <button onclick="setTemplate('Halo kak, permisi mau tanya...')" class="shrink-0 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition active:scale-95">
            👋 Halo kak...
          </button>
          <button onclick="setTemplate('Halo mas/pak, paket atas nama saya sudah sampai mana ya?')" class="shrink-0 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition active:scale-95">
            📦 Tanya Kurir
          </button>
          <button onclick="setTemplate('P, posisi dimana?')" class="shrink-0 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition active:scale-95">
            📍 Posisi?
          </button>
        </div>
      </div>

      <!-- Tombol Kirim -->
      <button 
        onclick="openWhatsApp()" 
        class="w-full bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-slate-950 font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-500/20 transition flex items-center justify-center gap-2 text-base"
      >
        <span>Mulai Chat di WhatsApp</span>
        <span>➔</span>
      </button>
    </div>

    <!-- Riwayat Nomor -->
    <div class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Riwayat Terakhir</h2>
        <button onclick="clearHistory()" id="clearHistoryBtn" class="hidden text-xs text-rose-400 hover:text-rose-300">
          Hapus Semua
        </button>
      </div>
      
      <div id="historyList" class="space-y-2">
        <!-- List riwayat muncul di sini -->
      </div>
    </div>

  </main>

  <!-- Toast Notifikasi -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-full shadow-xl border border-slate-700 opacity-0 pointer-events-none transition-opacity duration-300">
    Pesan notifikasi
  </div>

  <script>
    const phoneInput = document.getElementById('phone');
    const messageInput = document.getElementById('message');
    const clearBtn = document.getElementById('clearBtn');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    phoneInput.addEventListener('input', () => {
      clearBtn.classList.toggle('hidden', phoneInput.value.length === 0);
    });

    function clearInput() {
      phoneInput.value = '';
      clearBtn.classList.add('hidden');
      phoneInput.focus();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 2500);
    }

    async function pasteNumber() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          phoneInput.value = text;
          clearBtn.classList.remove('hidden');
          showToast('Nomor berhasil di-paste!');
        } else {
          showToast('Clipboard kosong bro');
        }
      } catch (err) {
        showToast('Gagal akses clipboard, tempel manual aja ya');
      }
    }

    function setTemplate(text) {
      messageInput.value = text;
    }

    function formatPhoneNumber(raw) {
      let cleaned = raw.replace(/\D/g, '');
      if (cleaned.startsWith('0')) {
        cleaned = '62' + cleaned.substring(1);
      } else if (cleaned.startsWith('8')) {
        cleaned = '62' + cleaned;
      }
      return cleaned;
    }

    function openWhatsApp(customNumber = null) {
      const rawNumber = customNumber || phoneInput.value;
      const formatted = formatPhoneNumber(rawNumber);

      if (!formatted || formatted.length < 9) {
        showToast('Masukin nomor HP yang bener dulu bro!');
        phoneInput.focus();
        return;
      }

      const text = encodeURIComponent(messageInput.value.trim());
      saveHistory(formatted);

      const waUrl = text 
        ? `https://api.whatsapp.com/send?phone=${formatted}&text=${text}`
        : `https://api.whatsapp.com/send?phone=${formatted}`;
      
      window.open(waUrl, '_system');
    }

    function saveHistory(number) {
      let history = JSON.parse(localStorage.getItem('wa_direct_history') || '[]');
      history = history.filter(item => item.number !== number);
      
      const now = new Date();
      const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      
      history.unshift({ number, time: timeStr });
      if (history.length > 10) history.pop();
      
      localStorage.setItem('wa_direct_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('wa_direct_history') || '[]');
      clearHistoryBtn.classList.toggle('hidden', history.length === 0);

      if (history.length === 0) {
        historyList.innerHTML = `
          <div class="text-center py-6 border border-dashed border-slate-800 rounded-xl text-slate-600 text-xs">
            Belum ada riwayat chat nih.
          </div>`;
        return;
      }

      historyList.innerHTML = history.map(item => `
        <div onclick="openWhatsApp('${item.number}')" class="bg-slate-900/70 hover:bg-slate-800/80 border border-slate-800/80 rounded-xl p-3 flex items-center justify-between cursor-pointer active:scale-[0.99] transition">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-xs text-emerald-400 font-semibold">
              #
            </div>
            <div>
              <p class="text-sm font-medium text-slate-200">+${item.number}</p>
              <p class="text-[11px] text-slate-500">Terakhir: ${item.time}</p>
            </div>
          </div>
          <span class="text-xs text-emerald-400 font-medium">Chat ➔</span>
        </div>
      `).join('');
    }

    function clearHistory() {
      localStorage.removeItem('wa_direct_history');
      renderHistory();
      showToast('Riwayat dibersihkan');
    }

    renderHistory();
  </script>
</body>
</html>
