<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WA Direct</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #06090e;
      background-image: 
        radial-gradient(circle at 50% -10%, rgba(16, 185, 129, 0.14), transparent 55%),
        radial-gradient(circle at 100% 40%, rgba(6, 182, 212, 0.06), transparent 45%);
    }
    input, textarea {
      user-select: text;
    }
    /* Sembunyikan scrollbar horizontal di template */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Efek kilau halus di atas card */
    .glass-card {
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.85) 0%, rgba(11, 15, 25, 0.92) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-emerald-500/30 selection:text-emerald-200">

  <!-- Header -->
  <header class="sticky top-0 z-20 px-5 pt-5 pb-3.5 bg-[#06090e]/80 backdrop-blur-xl border-b border-white/[0.06]">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <!-- Logo Ikon WA Minimalis -->
        <div class="relative w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-600 p-[1px] shadow-lg shadow-emerald-500/20">
          <div class="w-full h-full bg-[#0b1315] rounded-[15px] flex items-center justify-center">
            <svg class="w-5 h-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
          </div>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-[17px] tracking-tight text-white">WA Direct</h1>
            <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">PRO</span>
          </div>
          <p class="text-xs text-slate-400 mt-0.5">Kirim pesan instan tanpa simpan kontak</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 px-5 py-6 max-w-md w-full mx-auto space-y-7">

    <!-- Main Form Card -->
    <div class="glass-card border border-white/[0.08] rounded-3xl p-5 space-y-5">
      
      <!-- Input Nomor -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <label for="phone" class="text-[11px] font-semibold uppercase tracking-widest text-slate-400">Nomor Tujuan</label>
          <button onclick="pasteNumber()" class="group text-xs font-medium text-emerald-400 hover:text-emerald-300 bg-emerald-500/10 hover:bg-emerald-500/15 border border-emerald-500/20 px-2.5 py-1 rounded-lg flex items-center gap-1.5 active:scale-95 transition-all">
            <svg class="w-3.5 h-3.5 transition-transform group-hover:-translate-y-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Tempel</span>
          </button>
        </div>

        <div class="relative flex items-center group">
          <!-- Prefix +62 -->
          <div class="absolute left-0 inset-y-0 flex items-center pl-3.5 pr-3 pointer-events-none border-r border-white/[0.08]">
            <span class="font-mono text-sm font-semibold text-emerald-400">+62</span>
          </div>
          
          <input 
            type="tel" 
            id="phone" 
            placeholder="812 3456 7890" 
            autocomplete="off"
            class="w-full bg-[#070a10] border border-white/[0.08] focus:border-emerald-500/60 focus:ring-4 focus:ring-emerald-500/10 rounded-2xl py-3.5 pl-16 pr-11 font-mono text-[16px] tracking-wide text-white placeholder-slate-600 outline-none transition-all shadow-inner"
          >
          
          <button onclick="clearInput()" id="clearBtn" class="hidden absolute right-3 w-7 h-7 rounded-full bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <p class="text-[11px] text-slate-500 mt-2 flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-slate-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>Otomatis merapikan format 08..., +62, maupun spasi.</span>
        </p>
      </div>

      <!-- Divider Halus -->
      <div class="h-px bg-gradient-to-r from-transparent via-white/[0.07] to-transparent"></div>

      <!-- Input Pesan -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <label for="message" class="text-[11px] font-semibold uppercase tracking-widest text-slate-400">Pesan Pembuka</label>
          <span class="text-[10px] text-slate-500 font-medium">Opsional</span>
        </div>
        
        <textarea 
          id="message" 
          rows="3" 
          placeholder="Ketik pesan yang ingin langsung dikirim..." 
          class="w-full bg-[#070a10] border border-white/[0.08] focus:border-emerald-500/60 focus:ring-4 focus:ring-emerald-500/10 rounded-2xl p-3.5 text-sm leading-relaxed text-slate-100 placeholder-slate-600 outline-none transition-all resize-none shadow-inner"
        ></textarea>
        
        <!-- Template Cepat Chips -->
        <div class="flex gap-2 overflow-x-auto pt-3 pb-0.5 no-scrollbar">
          <button onclick="setTemplate('Halo kak, permisi mau tanya...')" class="shrink-0 text-xs font-medium bg-white/[0.04] hover:bg-white/[0.08] active:bg-emerald-500/10 text-slate-300 hover:text-white px-3 py-1.5 rounded-xl border border-white/[0.07] transition active:scale-95">
            Halo kak...
          </button>
          <button onclick="setTemplate('Halo mas/pak, paket atas nama saya sudah sampai mana ya?')" class="shrink-0 text-xs font-medium bg-white/[0.04] hover:bg-white/[0.08] active:bg-emerald-500/10 text-slate-300 hover:text-white px-3 py-1.5 rounded-xl border border-white/[0.07] transition active:scale-95">
            Tanya Kurir
          </button>
          <button onclick="setTemplate('Permisi, boleh share lokasi terkini?')" class="shrink-0 text-xs font-medium bg-white/[0.04] hover:bg-white/[0.08] active:bg-emerald-500/10 text-slate-300 hover:text-white px-3 py-1.5 rounded-xl border border-white/[0.07] transition active:scale-95">
            Minta Shareloc
          </button>
        </div>
      </div>

      <!-- Tombol CTA Utama -->
      <button 
        onclick="openWhatsApp()" 
        class="w-full relative overflow-hidden bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-[0.98] text-slate-950 font-bold py-3.5 px-5 rounded-2xl shadow-[0_10px_25px_-5px_rgba(16,185,129,0.4)] transition-all flex items-center justify-center gap-2.5 text-[15px]"
      >
        <span>Mulai Chat di WhatsApp</span>
        <svg class="w-4 h-4 stroke-[2.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>

    <!-- Riwayat Nomor -->
    <div class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-2">
          <h2 class="text-[11px] font-semibold uppercase tracking-widest text-slate-400">Riwayat Terakhir</h2>
          <span id="historyCount" class="hidden text-[10px] font-mono bg-white/[0.06] text-slate-400 px-1.5 py-0.5 rounded-md">0</span>
        </div>
        <button onclick="clearHistory()" id="clearHistoryBtn" class="hidden text-xs font-medium text-rose-400/90 hover:text-rose-300 transition">
          Bersihkan
        </button>
      </div>
      
      <div id="historyList" class="space-y-2.5">
        <!-- List riwayat muncul di sini -->
      </div>
    </div>

  </main>

  <!-- Toast Notifikasi Floating -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 backdrop-blur-md text-slate-100 text-xs font-medium px-4 py-2.5 rounded-full shadow-2xl border border-white/10 flex items-center gap-2 opacity-0 translate-y-2 pointer-events-none transition-all duration-300">
    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
    <span id="toastText">Notifikasi</span>
  </div>

  <script>
    const phoneInput = document.getElementById('phone');
    const messageInput = document.getElementById('message');
    const clearBtn = document.getElementById('clearBtn');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const historyCount = document.getElementById('historyCount');

    phoneInput.addEventListener('input', () => {
      clearBtn.classList.toggle('hidden', phoneInput.value.length === 0);
    });

    function clearInput() {
      phoneInput.value = '';
      clearBtn.classList.add('hidden');
      phoneInput.focus();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      toastText.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-2');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
      }, 2400);
    }

    async function pasteNumber() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          phoneInput.value = text.trim();
          clearBtn.classList.remove('hidden');
          showToast('Nomor berhasil ditempel');
        } else {
          showToast('Clipboard masih kosong');
        }
      } catch (err) {
        showToast('Tempel manual di kolom nomor ya');
      }
    }

    function setTemplate(text) {
      messageInput.value = text;
      messageInput.focus();
    }

    function formatPhoneNumber(raw) {
      let cleaned = raw.replace(/\D/g, '');
      if (cleaned.startsWith('0')) {
        cleaned = '62' + cleaned.substring(1);
      } else if (cleaned.startsWith('8')) {
        cleaned = '62' + cleaned;
      }
      return cleaned;
    }

    function formatDisplayNumber(num) {
      // Format 6281234567890 -> +62 812-3456-7890 biar enak dibaca
      if (num.startsWith('62') && num.length >= 10) {
        const local = num.substring(2);
        return `+62 ${local.slice(0, 3)}-${local.slice(3, 7)}-${local.slice(7)}`;
      }
      return `+${num}`;
    }

    function openWhatsApp(customNumber = null) {
      const rawNumber = customNumber || phoneInput.value;
      const formatted = formatPhoneNumber(rawNumber);

      if (!formatted || formatted.length < 9) {
        showToast('Masukkan nomor WhatsApp yang valid');
        phoneInput.focus();
        return;
      }

      const text = encodeURIComponent(messageInput.value.trim());
      saveHistory(formatted);

      const waUrl = text 
        ? `https://api.whatsapp.com/send?phone=${formatted}&text=${text}`
        : `https://api.whatsapp.com/send?phone=${formatted}`;
      
      window.open(waUrl, '_system');
    }

    function saveHistory(number) {
      let history = JSON.parse(localStorage.getItem('wa_direct_history') || '[]');
      history = history.filter(item => item.number !== number);
      
      const now = new Date();
      const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      
      history.unshift({ number, time: timeStr });
      if (history.length > 10) history.pop();
      
      localStorage.setItem('wa_direct_history', JSON.stringify(history));
      renderHistory();
    }

    function deleteHistoryItem(event, number) {
      event.stopPropagation();
      let history = JSON.parse(localStorage.getItem('wa_direct_history') || '[]');
      history = history.filter(item => item.number !== number);
      localStorage.setItem('wa_direct_history', JSON.stringify(history));
      renderHistory();
      showToast('Nomor dihapus dari riwayat');
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('wa_direct_history') || '[]');
      clearHistoryBtn.classList.toggle('hidden', history.length === 0);
      historyCount.classList.toggle('hidden', history.length === 0);
      historyCount.textContent = history.length;

      if (history.length === 0) {
        historyList.innerHTML = `
          <div class="flex flex-col items-center justify-center py-8 px-4 border border-dashed border-white/[0.08] rounded-2xl bg-white/[0.01] text-center">
            <div class="w-9 h-9 rounded-full bg-white/[0.04] flex items-center justify-center text-slate-500 mb-2">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            </div>
            <p class="text-xs font-medium text-slate-400">Belum ada riwayat chat</p>
            <p class="text-[11px] text-slate-600 mt-0.5">Nomor yang pernah dihubungi akan muncul di sini</p>
          </div>`;
        return;
      }

      historyList.innerHTML = history.map(item => `
        <div onclick="openWhatsApp('${item.number}')" class="group bg-[#0d121c]/90 hover:bg-[#131a29] border border-white/[0.06] hover:border-emerald-500/30 rounded-2xl p-3.5 flex items-center justify-between cursor-pointer active:scale-[0.99] transition-all">
          <div class="flex items-center gap-3.5">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
              </svg>
            </div>
            <div>
              <p class="font-mono text-sm font-medium text-slate-100 tracking-tight">${formatDisplayNumber(item.number)}</p>
              <p class="text-[11px] text-slate-500 mt-0.5">Pukul ${item.time}</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-lg group-hover:bg-emerald-500 group-hover:text-slate-950 transition-colors">Chat</span>
            <button onclick="deleteHistoryItem(event, '${item.number}')" class="p-1.5 text-slate-600 hover:text-rose-400 rounded-lg transition" title="Hapus">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    function clearHistory() {
      localStorage.removeItem('wa_direct_history');
      renderHistory();
      showToast('Semua riwayat dibersihkan');
    }

    renderHistory();
  </script>
</body>
</html>
