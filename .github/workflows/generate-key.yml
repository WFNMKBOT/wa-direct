name: Generate Keystore Base64
on: workflow_dispatch
jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate Key
        run: |
          keytool -genkey -v -keystore release.keystore -alias wadirect -keyalg RSA -keysize 2048 -validity 10000 -storepass wadirect123 -keypass wadirect123 -dname "CN=Wahyu, OU=Dev, O=WFN, L=Tangerang, S=Banten, C=ID"
          echo "=== COPY TEKS DI BAWAH INI ==="
          base64 -w 0 release.keystore
          echo ""
          echo "=== SAMPAI SINI ==="
